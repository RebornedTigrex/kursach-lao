<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="form-back">
        <div class="form">
            <div class="rlable">
                <p>Logging In</p>
            </div>
            <div>
                <form class="form-grid">
                    <label for="uname">Username</label>
                    <input type="text" id="uname" name="uname"><br>
                    <label for="umail">Gmail</label>
                    <input type="text" id="umail" name="umail"><br>
                    <label for="upass">Password</label>
                    <input type="password" id="upass" name="upass">
                </form>
            </div>
            <div>
                <button id="reg-button"><p style="font-size: xx-large;">Log in</p></button>
            </div>
            <div id="change-log-reg-button">
                <a href="registration.html" class="log-reg-link">Want to Register?</a>
            </div>
        </div>
    </div>
    <script src="../scripts/login.js"></script>
</body>
</html>
